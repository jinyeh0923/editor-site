<!doctype html>
<html lang="zh-Hant">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>後台 — 薯餅</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/core.css">
  <style>
    body {
      padding: clamp(20px, 4vw, 48px)
    }

    .admin-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 28px
    }

    .admin-head h1 {
      font-weight: 900;
      font-size: clamp(26px, 4vw, 40px);
      margin: 0
    }

    .admin-head .count {
      font-family: var(--fm);
      font-size: 13px;
      color: var(--accent)
    }

    .admin-head button,
    .abtn {
      font-family: var(--fm);
      font-size: 13px;
      color: var(--ink);
      background: transparent;
      border: 1px solid var(--line);
      padding: 9px 18px;
      border-radius: var(--pill);
      cursor: pointer;
      transition: .2s
    }

    .admin-head button:hover,
    .abtn:hover {
      border-color: var(--accent);
      color: var(--accent)
    }

    .abtn:disabled {
      opacity: .35;
      cursor: default;
      border-color: var(--line);
      color: var(--ink)
    }

    /* 分頁：每個資源一頁（來件 / 作品 / 之後的案例、文案） */
    .tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 28px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--line)
    }

    .tabs button {
      font-family: var(--fm);
      font-size: 13px;
      color: var(--muted);
      background: transparent;
      border: 1px solid var(--line);
      padding: 9px 18px;
      border-radius: var(--pill);
      cursor: pointer;
      transition: .2s
    }

    .tabs button:hover {
      color: var(--ink)
    }

    .tabs button.on {
      color: var(--on-accent);
      background: var(--accent);
      border-color: var(--accent)
    }

    .head-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap
    }

    .note {
      font-family: var(--fm);
      font-size: 13px;
      color: var(--accent);
      min-height: 20px;
      margin: 0 0 14px
    }

    .note.bad {
      color: #ff6b6b
    }

    .hint {
      font-size: 13px;
      color: var(--muted);
      margin: 0 0 10px
    }

    /* 新增 / 編輯作品的跳窗（原生 dialog：自帶 Esc 關閉與焦點鎖定） */
    .wdialog {
      width: min(760px, calc(100vw - 32px));
      max-height: calc(100dvh - 48px);
      padding: 0;
      overflow: auto;
      color-scheme: dark; /* 捲軸跟著深色，不要出現白色捲軸 */
      color: var(--ink);
      background: var(--bg-2);
      border: 1px solid var(--line);
      border-radius: var(--r)
    }

    .wdialog::backdrop {
      background: rgba(0, 0, 0, .62);
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px)
    }

    /* 跳窗開著時鎖住背景捲動 */
    html:has(.wdialog[open]) {
      overflow: hidden
    }

    /* 作品表單（core.css 的 form 是單欄 560px，這裡放寬成兩欄） */
    .wform {
      max-width: none;
      grid-template-columns: 1fr 1fr;
      gap: 16px 20px;
      padding: 24px
    }

    .wform .note {
      margin: 0;
      min-height: 0
    }

    /* core.css 的 form / label 是 display:grid，會蓋掉 hidden 屬性 */
    .wform[hidden],
    .wform [hidden] {
      display: none
    }

    .wform h2 {
      grid-column: 1 / -1;
      margin: 0;
      font-weight: 900;
      font-size: 20px
    }

    .wform .wide,
    .wform .checks,
    .wform .form-actions {
      grid-column: 1 / -1
    }

    /* 同一列兩個欄位高度不同時（一邊有說明文字），輸入框靠上對齊、不被拉高 */
    .wform label {
      align-content: start
    }

    .wform input,
    .wform select {
      background-color: var(--bg);
      min-width: 0
    }

    .wform small {
      font-family: var(--f);
      font-size: 12px;
      letter-spacing: 0;
      color: var(--muted-2)
    }

    .wform .checks {
      display: flex;
      gap: 24px;
      flex-wrap: wrap
    }

    .wform .checks label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer
    }

    .wform input[type="checkbox"] {
      width: 18px;
      height: 18px;
      padding: 0;
      accent-color: var(--accent)
    }

    .wform .form-actions {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap
    }

    /* 作品分類篩選：選了分類就只列那一類，排序也只在那一類裡面排 */
    .wfilter {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 0 0 14px
    }

    .wfilter button {
      font-family: var(--fm);
      font-size: 13px;
      color: var(--muted);
      background: transparent;
      border: 1px solid var(--line);
      padding: 7px 14px;
      border-radius: var(--pill);
      cursor: pointer;
      transition: .2s
    }

    .wfilter button:hover {
      color: var(--ink)
    }

    .wfilter button[aria-pressed="true"] {
      color: var(--accent);
      border-color: var(--accent)
    }

    /* 作品列表 */
    #w-rows td {
      vertical-align: middle
    }

    #w-rows tr.off td {
      opacity: .45
    }

    #w-rows tr.off td.ops,
    #w-rows tr.off td.order {
      opacity: 1
    }

    #w-rows .order,
    #w-rows .ops {
      white-space: nowrap
    }

    #w-rows .abtn {
      padding: 6px 12px
    }

    /* 排序：拖拉把手 + 可直接改的編號 + ↑↓ */
    #w-rows .order-in {
      display: flex;
      align-items: center;
      gap: 6px
    }

    #w-rows .grip {
      display: grid;
      place-items: center;
      width: 26px;
      height: 34px;
      color: var(--muted-2);
      cursor: grab
    }

    #w-rows .grip:hover {
      color: var(--accent)
    }

    #w-rows .grip svg {
      width: 14px;
      height: 20px
    }

    #w-rows .pos {
      width: 58px;
      padding: 7px 4px;
      font-family: var(--fm);
      font-size: 14px;
      text-align: center;
      background: var(--bg);
      -moz-appearance: textfield;
      appearance: textfield
    }

    #w-rows .pos::-webkit-outer-spin-button,
    #w-rows .pos::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0
    }

    #w-rows tr.dragging td {
      opacity: .35
    }

    #w-rows tr.drop-before td {
      box-shadow: inset 0 3px 0 var(--accent)
    }

    #w-rows tr.drop-after td {
      box-shadow: inset 0 -3px 0 var(--accent)
    }

    #w-rows .thumb {
      display: block;
      width: 54px;
      height: 54px;
      object-fit: cover;
      border-radius: 6px;
      background: var(--bg)
    }

    #w-rows .wtitle {
      max-width: 34ch;
      word-break: break-word
    }

    #w-rows .wid {
      display: block;
      font-family: var(--fm);
      font-size: 12px;
      color: var(--muted-2)
    }

    #w-rows .abtn.danger:hover {
      border-color: #ff6b6b;
      color: #ff6b6b
    }

    @media (prefers-reduced-motion: reduce) {

      .tabs button,
      .wfilter button,
      .abtn,
      .admin-head button {
        transition: none
      }
    }

    @media (max-width: 640px) {
      .wform {
        grid-template-columns: 1fr;
        padding: 16px
      }
    }

    .tablewrap {
      border: 1px solid var(--line);
      border-radius: var(--r);
      overflow: auto;
      background: var(--bg-2)
    }

    table {
      border-collapse: collapse;
      width: 100%;
      min-width: 760px
    }

    th,
    td {
      padding: 12px 14px;
      text-align: left;
      vertical-align: top;
      font-size: 14px;
      border-bottom: 1px solid var(--line)
    }

    th {
      font-family: var(--fm);
      font-size: 12px;
      letter-spacing: .05em;
      color: var(--muted);
      text-transform: uppercase;
      background: rgba(255, 255, 255, .02);
      position: sticky;
      top: 0
    }

    td .time {
      font-family: var(--fm);
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap
    }

    td .msg {
      max-width: 42ch;
      white-space: pre-wrap;
      word-break: break-word
    }

    td a {
      color: var(--accent)
    }

    .tag {
      font-family: var(--fm);
      font-size: 12px;
      border: 1px solid var(--line);
      padding: 3px 8px;
      border-radius: var(--pill);
      color: var(--muted);
      white-space: nowrap
    }

    .empty,
    .err {
      font-family: var(--fm);
      color: var(--muted);
      padding: 28px;
      text-align: center
    }

    .err {
      color: #ff6b6b
    }
  </style>
</head>

<body>
  <!-- 分頁：新增一個資源 = 加一顆按鈕 + 一個 data-panel 區塊 + 在 script 的 PANELS 登記載入函式 -->
  <nav class="tabs" id="tabs" aria-label="後台分頁">
    <button type="button" data-tab="submissions">來件</button>
    <button type="button" data-tab="works">作品</button>
  </nav>

  <section data-panel="submissions">
    <div class="admin-head">
      <div>
        <h1>訪客表單 <span class="count" id="count"></span></h1>
      </div>
      <button id="refresh" type="button">重新整理</button>
    </div>
    <div class="tablewrap">
      <table>
        <thead>
          <tr>
            <th>時間</th>
            <th>姓名</th>
            <th>Email</th>
            <th>類型</th>
            <th>狀態</th>
            <th>內容</th>
          </tr>
        </thead>
        <tbody id="rows">
          <tr>
            <td colspan="6" class="empty">載入中…</td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>

  <section data-panel="works" hidden>
    <div class="admin-head">
      <div>
        <h1>作品 <span class="count" id="w-count"></span></h1>
      </div>
      <div class="head-actions">
        <button id="w-new" type="button">新增作品</button>
        <button id="w-refresh" type="button">重新整理</button>
      </div>
    </div>
    <p class="hint">排序：拖拉左邊的把手，或直接改編號後按 Enter，也可以用 ↑↓。編號 1 排在網站最前面。改完後前台最多 1 分鐘內更新。</p>
    <p class="hint">選一個分類＝只看那一類，編號和排序都是「這個分類裡」的順序（就是作品集頁點該分類看到的順序），不會動到其他分類。</p>
    <div class="wfilter" id="w-filter" role="group" aria-label="作品分類篩選"></div>
    <p class="note" id="w-note" role="status" aria-live="polite"></p>

    <dialog class="wdialog" id="w-dialog" aria-labelledby="w-form-title">
    <form class="wform" id="w-form" novalidate>
      <h2 id="w-form-title">新增作品</h2>
      <label class="wide">作品連結
        <input name="url" type="text" inputmode="url" autocomplete="off" maxlength="300"
          placeholder="https://www.instagram.com/reel/… 或 https://youtu.be/…">
        <small>只接受 YouTube 或 Instagram 的作品連結。留空＝卡片不可點擊。</small>
      </label>
      <label>分類
        <input name="cat" type="text" list="w-cats" autocomplete="off" maxlength="40" required>
        <small>從清單選現有分類，或直接輸入新的。</small>
      </label>
      <label>標題
        <input name="title" type="text" autocomplete="off" maxlength="120">
      </label>
      <label>長度
        <input name="dur" type="text" autocomplete="off" maxlength="12" placeholder="0:33">
      </label>
      <label>觀看數
        <input name="views" type="text" autocomplete="off" maxlength="20" placeholder="12.3萬">
      </label>
      <label class="wide">封面圖路徑
        <input name="poster" type="text" autocomplete="off" maxlength="200" placeholder="posters/works/reel-40.jpg">
        <small>Instagram 作品必填（圖檔要先請開發者放進網站）。YouTube 留空會自動抓縮圖。</small>
      </label>
      <label>比例
        <select name="ratio">
          <option value="">自動判斷</option>
          <option value="9/16">9:16 直式</option>
          <option value="16/9">16:9 橫式</option>
          <option value="1/1">1:1 方形</option>
        </select>
      </label>
      <label>左上角標籤
        <input name="tag" type="text" autocomplete="off" maxlength="20" placeholder="留空自動（Reels / Shorts / YouTube）">
      </label>
      <label class="wide" id="w-id-field">作品 ID
        <input name="id" type="text" autocomplete="off" maxlength="64" placeholder="留空自動產生">
        <small>建立後不能修改。有填連結時可以留空；沒有連結的作品必須自己填（英數、連字號、底線）。</small>
      </label>
      <div class="checks">
        <label><input name="visible" type="checkbox" checked> 上架（取消勾選＝先存成下架）</label>
        <label><input name="home" type="checkbox"> 首頁精選</label>
      </div>
      <div class="form-actions">
        <button type="submit" id="w-save">儲存</button>
        <button type="button" class="abtn" id="w-cancel">取消</button>
        <p class="note bad" id="w-form-note" role="alert"></p>
      </div>
    </form>
    </dialog>
    <datalist id="w-cats"></datalist>

    <div class="tablewrap">
      <table>
        <thead>
          <tr>
            <th>順序</th>
            <th>封面</th>
            <th>標題</th>
            <th>分類</th>
            <th>長度</th>
            <th>觀看</th>
            <th>狀態</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="w-rows">
          <tr>
            <td colspan="8" class="empty">載入中…</td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>

  <script>
    var rows = document.getElementById("rows");
    var countEl = document.getElementById("count");

    function fmtTime(iso) {
      try {
        var d = new Date(iso);
        var date = d.toLocaleDateString("zh-TW", { year: "numeric", month: "2-digit", day: "2-digit" });
        var wd = d.toLocaleDateString("zh-TW", { weekday: "short" }); // 週五
        return date + "（" + wd + "）";
      } catch (e) { return iso || ""; }
    }
    function cell(text, cls) {
      var td = document.createElement("td");
      if (cls) td.className = cls;
      td.textContent = text == null ? "" : String(text); // textContent → 不會被 XSS
      return td;
    }
    function render(list) {
      countEl.textContent = "（" + list.length + " 筆）";
      rows.innerHTML = "";
      if (!list.length) {
        rows.innerHTML = '<tr><td colspan="6" class="empty">目前沒有資料</td></tr>';
        return;
      }
      list.forEach(function (r) {
        var tr = document.createElement("tr");
        var tTime = document.createElement("td"); var sp = document.createElement("span"); sp.className = "time"; sp.textContent = fmtTime(r.created_at); tTime.appendChild(sp);
        tr.appendChild(tTime);
        tr.appendChild(cell(r.name));
        // email 做成 mailto，但 textContent 設定文字、href 用 encodeURIComponent 防注入
        var tdEmail = document.createElement("td");
        var a = document.createElement("a");
        a.href = "mailto:" + encodeURIComponent(r.email || "");
        a.textContent = r.email || "";
        tdEmail.appendChild(a);
        tr.appendChild(tdEmail);
        // 類型 tag
        var tdType = document.createElement("td");
        if (r.video_type) { var sp2 = document.createElement("span"); sp2.className = "tag"; sp2.textContent = r.video_type; tdType.appendChild(sp2); }
        tr.appendChild(tdType);
        tr.appendChild(cell(r.status || "new"));
        tr.appendChild(cell(r.message, "msg"));
        rows.appendChild(tr);
      });
    }

    function load() {
      rows.innerHTML = '<tr><td colspan="6" class="empty">載入中…</td></tr>';
      fetch("/api/admin/submissions", { headers: { "Accept": "application/json" } })
        .then(function (res) { if (!res.ok) throw new Error(res.status); return res.json(); })
        .then(render)
        .catch(function (err) {
          rows.innerHTML = '<tr><td colspan="6" class="err">讀取失敗（' + err.message + '）。請重新整理或重新登入。</td></tr>';
          countEl.textContent = "";
        });
    }
    document.getElementById("refresh").addEventListener("click", load);

    /* ---------- 作品 ---------- */
    var wRows = document.getElementById("w-rows");
    var wCount = document.getElementById("w-count");
    var wNote = document.getElementById("w-note");
    var wForm = document.getElementById("w-form");
    var wDialog = document.getElementById("w-dialog");
    var wFormNote = document.getElementById("w-form-note");
    var wFormTitle = document.getElementById("w-form-title");
    var wIdField = document.getElementById("w-id-field");
    var wCats = document.getElementById("w-cats");
    var works = [];
    var wFilter = document.getElementById("w-filter");
    var wCat = "";   // 目前篩選的分類；空字串＝全部
    var view = [];   // 畫面上列出的作品（全部，或某一分類），編號與排序都以它為準
    var editingId = null; // null＝新增
    var busy = false;
    var dragId = null; // 正在拖的作品 id
    var GRIP_SVG = '<svg viewBox="0 0 14 20" fill="currentColor" aria-hidden="true"><circle cx="4" cy="4" r="1.6"/><circle cx="10" cy="4" r="1.6"/><circle cx="4" cy="10" r="1.6"/><circle cx="10" cy="10" r="1.6"/><circle cx="4" cy="16" r="1.6"/><circle cx="10" cy="16" r="1.6"/></svg>';

    function note(text, bad) {
      wNote.textContent = text || "";
      wNote.className = bad ? "note bad" : "note";
    }
    // 後台 API 共用：一律 JSON；失敗時丟出伺服器回的 error 訊息
    function api(method, path, body) {
      var opt = { method: method, headers: { "Accept": "application/json" } };
      if (body !== undefined) {
        opt.headers["Content-Type"] = "application/json";
        opt.body = JSON.stringify(body);
      }
      return fetch(path, opt).then(function (res) {
        return res.json().catch(function () { return {}; }).then(function (data) {
          if (!res.ok) throw new Error(data.error || ("錯誤 " + res.status));
          return data;
        });
      });
    }
    // 送出期間鎖住所有操作，避免連點造成順序錯亂
    // onError：錯誤要顯示在別處時用（跳窗開著時，頁面上的訊息會被擋住）
    function run(promise, okText, onError) {
      if (busy) return;
      busy = true;
      document.body.style.cursor = "progress";
      return promise
        .then(function (r) { if (okText) note(okText); return r; })
        .catch(function (err) { if (onError) onError(err); else note(err.message, true); })
        .then(function () { busy = false; document.body.style.cursor = ""; });
    }

    function thumbSrc(w) {
      if (w.poster) return "/" + w.poster;
      var yt = (w.url || "").match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|shorts\/|embed\/))([\w-]{6,})/);
      return yt ? "https://img.youtube.com/vi/" + yt[1] + "/hqdefault.jpg" : "";
    }
    function btn(text, label, onClick, cls) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "abtn" + (cls ? " " + cls : "");
      b.textContent = text;
      if (label) b.setAttribute("aria-label", label);
      b.addEventListener("click", onClick);
      return b;
    }

    function renderWorks() {
      var shown = works.filter(function (w) { return w.visible; }).length;
      wCount.textContent = "（" + works.length + " 筆，上架 " + shown + "）";
      renderFilter();
      view = wCat ? works.filter(function (w) { return w.cat === wCat; }) : works.slice();
      wRows.innerHTML = "";
      if (!works.length) {
        wRows.innerHTML = '<tr><td colspan="8" class="empty">目前沒有作品</td></tr>';
        return;
      }
      view.forEach(function (w, i) {
        var name = w.title || "（無標題）";
        var tr = document.createElement("tr");
        if (!w.visible) tr.className = "off";

        var tdOrder = document.createElement("td");
        tdOrder.className = "order";
        var orderIn = document.createElement("div");
        orderIn.className = "order-in";
        tdOrder.appendChild(orderIn);
        // 拖拉把手：只有把手可拖（整列可拖會妨礙選取文字、點連結），拖的時候顯示整列的影像
        var grip = document.createElement("span");
        grip.className = "grip";
        grip.title = "拖拉排序";
        grip.draggable = true;
        grip.innerHTML = GRIP_SVG;
        grip.addEventListener("dragstart", function (e) {
          if (busy) { e.preventDefault(); return; }
          dragId = w.id;
          e.dataTransfer.effectAllowed = "move";
          e.dataTransfer.setData("text/plain", w.id);
          e.dataTransfer.setDragImage(tr, 20, tr.offsetHeight / 2);
          // 晚一格再變淡，否則拖曳影像也會跟著變淡
          setTimeout(function () { tr.classList.add("dragging"); }, 0);
        });
        grip.addEventListener("dragend", function () {
          dragId = null;
          dragY = null;
          clearDropMarks();
          tr.classList.remove("dragging");
        });
        orderIn.appendChild(grip);
        // 編號＝目前位置（1 開始）；直接改數字就移到那個位置
        var pos = document.createElement("input");
        pos.className = "pos";
        pos.type = "number";
        pos.min = 1;
        pos.max = view.length;
        pos.value = i + 1;
        pos.setAttribute("aria-label", "編號：" + name);
        pos.addEventListener("change", function () {
          var n = Math.round(Number(pos.value));
          if (!n) { pos.value = i + 1; return; }
          moveTo(w.id, Math.max(1, Math.min(view.length, n)) - 1);
        });
        pos.addEventListener("keydown", function (e) { if (e.key === "Enter") pos.blur(); });
        orderIn.appendChild(pos);
        var up = btn("↑", "上移：" + name, function () { moveTo(w.id, i - 1); });
        var down = btn("↓", "下移：" + name, function () { moveTo(w.id, i + 1); });
        up.disabled = i === 0;
        down.disabled = i === view.length - 1;
        orderIn.appendChild(up);
        orderIn.appendChild(down);
        tr.appendChild(tdOrder);

        tr.setAttribute("data-id", w.id);
        tr.addEventListener("dragover", function (e) {
          if (!dragId || dragId === w.id) return;
          e.preventDefault();
          e.dataTransfer.dropEffect = "move";
          var r = tr.getBoundingClientRect();
          var after = e.clientY > r.top + r.height / 2;
          clearDropMarks();
          tr.classList.add(after ? "drop-after" : "drop-before");
        });
        tr.addEventListener("drop", function (e) {
          if (!dragId || dragId === w.id) return;
          e.preventDefault();
          var r = tr.getBoundingClientRect();
          var after = e.clientY > r.top + r.height / 2;
          var from = indexOfWork(dragId);
          var to = i + (after ? 1 : 0);
          if (from < to) to--; // 先抽走拖的那筆，後面的位置會往前一格
          moveTo(dragId, to);
        });

        var tdThumb = document.createElement("td");
        var src = thumbSrc(w);
        if (src) {
          var img = document.createElement("img");
          img.className = "thumb";
          img.loading = "lazy";
          img.alt = "";
          img.onerror = function () { this.style.visibility = "hidden"; };
          img.src = src;
          tdThumb.appendChild(img);
        }
        tr.appendChild(tdThumb);

        // 標題：有連結就可點去平台確認；文字一律 textContent
        var tdTitle = document.createElement("td");
        tdTitle.className = "wtitle";
        if (w.url && /^https:\/\//.test(w.url)) {
          var a = document.createElement("a");
          a.href = w.url;
          a.target = "_blank";
          a.rel = "noopener noreferrer";
          a.textContent = name;
          tdTitle.appendChild(a);
        } else {
          tdTitle.appendChild(document.createTextNode(name));
        }
        var idEl = document.createElement("span");
        idEl.className = "wid";
        idEl.textContent = w.id;
        tdTitle.appendChild(idEl);
        tr.appendChild(tdTitle);

        tr.appendChild(cell(w.cat));
        tr.appendChild(cell(w.dur));
        tr.appendChild(cell(w.views));

        var tdState = document.createElement("td");
        var st = document.createElement("span");
        st.className = "tag";
        st.textContent = w.visible ? "上架中" : "已下架";
        tdState.appendChild(st);
        if (w.home) {
          var hm = document.createElement("span");
          hm.className = "tag";
          hm.textContent = "首頁精選";
          tdState.appendChild(document.createTextNode(" "));
          tdState.appendChild(hm);
        }
        tr.appendChild(tdState);

        var tdOps = document.createElement("td");
        tdOps.className = "ops";
        tdOps.appendChild(btn("編輯", "編輯：" + name, function () { openForm(w); }));
        tdOps.appendChild(document.createTextNode(" "));
        tdOps.appendChild(btn(w.visible ? "下架" : "上架", (w.visible ? "下架：" : "上架：") + name, function () { toggle(w); }));
        tdOps.appendChild(document.createTextNode(" "));
        tdOps.appendChild(btn("刪除", "刪除：" + name, function () { remove(w); }, "danger"));
        tr.appendChild(tdOps);

        wRows.appendChild(tr);
      });

      // 分類建議清單：現有作品用過的分類
      var seen = {};
      wCats.innerHTML = "";
      works.forEach(function (w) {
        if (!w.cat || seen[w.cat]) return;
        seen[w.cat] = 1;
        var o = document.createElement("option");
        o.value = w.cat;
        wCats.appendChild(o);
      });
    }

    // 分類按鈕：「全部」+ 現有分類（照目前順序第一次出現的先後），括號內是筆數
    function renderFilter() {
      var cats = [], n = {};
      works.forEach(function (w) {
        if (!n[w.cat]) { n[w.cat] = 0; cats.push(w.cat); }
        n[w.cat]++;
      });
      if (wCat && !n[wCat]) wCat = ""; // 篩選中的分類已經沒有作品（刪光或改了分類）
      wFilter.innerHTML = "";
      [""].concat(cats).forEach(function (c) {
        var b = document.createElement("button");
        b.type = "button";
        b.textContent = (c || "全部") + "（" + (c ? n[c] : works.length) + "）";
        b.setAttribute("aria-pressed", c === wCat);
        b.addEventListener("click", function () { if (busy) return; wCat = c; note(""); renderWorks(); });
        wFilter.appendChild(b);
      });
    }

    function fetchWorks() {
      return api("GET", "/api/admin/works").then(function (list) { works = list; renderWorks(); });
    }
    function loadWorks() {
      wRows.innerHTML = '<tr><td colspan="8" class="empty">載入中…</td></tr>';
      note("");
      fetchWorks().catch(function (err) {
        wRows.innerHTML = '<tr><td colspan="8" class="err"></td></tr>';
        wRows.querySelector(".err").textContent = "讀取失敗（" + err.message + "）。請重新整理或重新登入。";
        wCount.textContent = "";
      });
    }

    // 在畫面列表（view）裡的位置
    function indexOfWork(id) {
      for (var k = 0; k < view.length; k++) if (view[k].id === id) return k;
      return -1;
    }
    // 拖到視窗上下邊緣時自動捲動（瀏覽器原生拖放在這個版面不會自己捲，滾輪在拖曳中也沒作用）。
    // 越靠近邊緣捲越快；dragover 會持續觸發，所以停在邊緣不動也會一直捲。
    var dragY = null, scrollRaf = 0;
    function autoScroll() {
      scrollRaf = 0;
      if (dragId === null || dragY === null) return;
      var edge = 110, max = 26, d = 0;
      if (dragY < edge) d = -max * (1 - Math.max(dragY, 0) / edge);
      else if (dragY > innerHeight - edge) d = max * (1 - Math.max(innerHeight - dragY, 0) / edge);
      if (d) window.scrollBy(0, d);
      scrollRaf = requestAnimationFrame(autoScroll);
    }
    document.addEventListener("dragover", function (e) {
      if (dragId === null) return;
      dragY = e.clientY;
      if (!scrollRaf) scrollRaf = requestAnimationFrame(autoScroll);
    });

    function clearDropMarks() {
      wRows.querySelectorAll(".drop-before, .drop-after").forEach(function (el) {
        el.classList.remove("drop-before", "drop-after");
      });
    }
    // 把一筆移到畫面列表的第 to 個位置（0 開始）。畫面先更新，再把整份順序送給伺服器；
    // 失敗就重新抓一次，回到伺服器上的實際順序。
    // 有篩選分類時：這個分類的作品在整份順序裡佔的那幾格不變，只在那幾格裡換位置，其他分類完全不動。
    function moveTo(id, to) {
      var from = indexOfWork(id);
      if (busy || from < 0 || to < 0 || to >= view.length || to === from) { renderWorks(); return; }
      var next = view.slice();
      var item = next.splice(from, 1)[0];
      next.splice(to, 0, item);
      if (wCat) {
        var k = 0;
        works = works.map(function (w) { return w.cat === wCat ? next[k++] : w; });
      } else {
        works = next;
      }
      renderWorks();
      var ids = works.map(function (w) { return w.id; });
      var failed = false;
      run(
        api("POST", "/api/admin/works/reorder", { ids: ids }).catch(function (err) { failed = true; throw err; }),
        "已移到" + (wCat ? "「" + wCat + "」的" : "") + "第 " + (to + 1) + " 個：" + (item.title || item.id)
      ).then(function () { if (failed) fetchWorks().catch(function () {}); });
    }
    function toggle(w) {
      run(
        api("PUT", "/api/admin/works/" + encodeURIComponent(w.id), { visible: w.visible ? 0 : 1 }).then(fetchWorks),
        (w.visible ? "已下架：" : "已上架：") + (w.title || w.id)
      );
    }
    function remove(w) {
      if (busy) return;
      if (!confirm("確定刪除「" + (w.title || w.id) + "」？刪除後無法復原。\n只是暫時不想顯示的話，請改用「下架」。")) return;
      if (editingId === w.id) closeForm();
      run(
        api("DELETE", "/api/admin/works/" + encodeURIComponent(w.id)).then(fetchWorks),
        "已刪除：" + (w.title || w.id)
      );
    }

    function openForm(w) {
      editingId = w ? w.id : null;
      wFormTitle.textContent = w ? "編輯作品（" + w.id + "）" : "新增作品";
      wIdField.hidden = !!w; // id 建立後不可變更，編輯時不顯示
      var f = wForm.elements;
      ["url", "cat", "title", "dur", "views", "poster", "ratio", "tag"].forEach(function (k) {
        f[k].value = (w && w[k]) || "";
      });
      f.id.value = "";
      f.visible.checked = w ? !!w.visible : true;
      f.home.checked = w ? !!w.home : false;
      wFormNote.textContent = "";
      note("");
      if (!wDialog.open) wDialog.showModal();
      wDialog.scrollTop = 0;
      f.url.focus();
    }
    function closeForm() {
      if (wDialog.open) wDialog.close();
    }
    // 按鈕、Esc、存檔成功都會走到 close 事件
    wDialog.addEventListener("close", function () { editingId = null; });
    // 跳窗開著時，錯誤顯示在跳窗裡；已經關了（例如存檔成功但重新讀取失敗）就顯示在頁面上
    function formError(err) {
      if (wDialog.open) wFormNote.textContent = err.message;
      else note(err.message, true);
    }
    wForm.addEventListener("submit", function (e) {
      e.preventDefault();
      var f = wForm.elements;
      var data = { visible: f.visible.checked ? 1 : 0, home: f.home.checked ? 1 : 0 };
      ["url", "cat", "title", "dur", "views", "poster", "ratio", "tag"].forEach(function (k) {
        data[k] = f[k].value.trim();
      });
      if (!data.cat) { wFormNote.textContent = "請填分類"; f.cat.focus(); return; }
      wFormNote.textContent = "";
      var req;
      if (editingId) {
        req = api("PUT", "/api/admin/works/" + encodeURIComponent(editingId), data);
      } else {
        if (f.id.value.trim()) data.id = f.id.value.trim();
        req = api("POST", "/api/admin/works", data);
      }
      var wasEdit = !!editingId;
      run(
        req.then(function (saved) {
          closeForm();
          if (wCat && data.cat !== wCat) wCat = data.cat; // 存到別的分類 → 切過去，不然列表上看不到
          return fetchWorks().then(function () { return saved; });
        }),
        wasEdit ? "已儲存" : "已新增，排在最前面（該分類的第 1 個）",
        formError
      );
    });
    document.getElementById("w-cancel").addEventListener("click", closeForm);
    document.getElementById("w-new").addEventListener("click", function () { openForm(null); });
    document.getElementById("w-refresh").addEventListener("click", loadWorks);

    /* ---------- 分頁 ---------- */
    var PANELS = { submissions: load, works: loadWorks }; // 分頁名 → 第一次開啟時的載入函式
    var loaded = {};
    function showTab(name) {
      if (!PANELS[name]) name = "submissions";
      document.querySelectorAll("[data-panel]").forEach(function (p) {
        p.hidden = p.getAttribute("data-panel") !== name;
      });
      document.querySelectorAll("#tabs button").forEach(function (b) {
        var on = b.getAttribute("data-tab") === name;
        b.classList.toggle("on", on);
        if (on) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
      });
      if (!loaded[name]) { loaded[name] = true; PANELS[name](); }
      history.replaceState(null, "", "#" + name);
    }
    document.getElementById("tabs").addEventListener("click", function (e) {
      var b = e.target.closest("button[data-tab]");
      if (b) showTab(b.getAttribute("data-tab"));
    });
    showTab(location.hash.slice(1));
  </script>
</body>
